---
- name: Assert supported VM platform
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_version'] in ["24.04", "26.04", "26.10"]
      - ansible_facts['architecture'] in ["x86_64", "aarch64"]
    fail_msg: "Требуется Ubuntu 24.04, 26.04 или 26.10; архитектура amd64 или arm64"

- name: Install base packages and remote module dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssh-server
      - ufw
      - python3-debian
      - python3-requests
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker official repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [stable]
    architectures:
      - "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Check AMD64 emulation registration on ARM64
  ansible.builtin.stat:
    path: /proc/sys/fs/binfmt_misc/qemu-x86_64
    get_checksum: false
  register: amd64_emulation
  when: ansible_facts['architecture'] == "aarch64"

- name: Register AMD64 emulation on ARM64 when missing
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --privileged
      - --rm
      - tonistiigi/binfmt
      - --install
      - amd64
  when:
    - ansible_facts['architecture'] == "aarch64"
    - not amd64_emulation.stat.exists